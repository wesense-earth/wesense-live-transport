name: Dependabot auto-merge

# Merges Dependabot PRs that are security fixes or patch-level bumps, once the
# required checks on main have passed, then starts the build so the fix is
# published. Minor and major bumps are left for a human.
# Details: https://docs.wesense.earth/developers/dependency-updates

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

# A new push to the PR (for example a Dependabot rebase) replaces the old wait.
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the required checks
        id: eligible
        if: steps.meta.outputs.alert-state != '' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          # Give the other workflows time to register their checks first.
          sleep 90
          gh pr checks "$PR_URL" --required --watch --interval 30

      - name: Merge
        if: steps.eligible.outcome == 'success'
        run: gh pr merge --squash "$PR_URL"

      # Merges made with the built-in token do not trigger push workflows, so
      # start the build by hand. (workflow_dispatch is the one trigger the
      # built-in token may use.)
      - name: Start the build on main
        if: steps.eligible.outcome == 'success'
        run: |
          gh workflow run docker-build.yml --repo "$GITHUB_REPOSITORY" --ref main
