name: Dependabot auto-merge

# Turns on GitHub auto-merge for Dependabot PRs that are security fixes or
# patch-level bumps. The PR still has to pass the required checks on main
# (see branch protection) before GitHub merges it. Minor and major bumps are
# left for a human. Details: https://docs.wesense.earth/developers/dependency-updates

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    if: github.event.action != 'closed' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (security fix or patch bump)
        if: steps.meta.outputs.alert-state != '' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A merge made by auto-merge uses the built-in token, and GitHub does not
  # start push workflows for those. Start the build by hand so the fix is
  # published. (workflow_dispatch is the one trigger the built-in token may use.)
  publish:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.merged_by.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Start the build on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker-build.yml --repo "$GITHUB_REPOSITORY" --ref main
